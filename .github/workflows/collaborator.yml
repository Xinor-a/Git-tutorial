name: Collaborator Simulator

on:
  workflow_dispatch:

jobs:
  simulate-collaborator:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create collaborator branch and commit
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH="collaborator/update-${DATE}"
          git checkout -b "${BRANCH}"
          mkdir -p collaborator-logs
          echo "- Collaborator update: ${DATE}" >> collaborator-logs/collaborator-log.md
          git add collaborator-logs/collaborator-log.md
          git commit -m "chore: collaborator update ${DATE}"
          git push origin "${BRANCH}"
